name: CI/CD Pipeline - AWS Production Deployment

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  validate:
    name: Run Automated Tests & Quality Gates
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Backend Dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Backend Pytest Suite
        working-directory: backend
        env:
          DATABASE_URL: "sqlite:///./test_runner.db"
          REDIS_URL: ""
          JWT_SECRET_KEY: "ci-testing-jwt-secret-key-minimum-32-chars-long"
        run: |
          pytest -v

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: npm ci

      - name: Verify Frontend Production Build
        working-directory: frontend
        env:
          NEXT_PUBLIC_API_URL: "https://api.smartedu.local"
        run: npm run build

  deploy:
    name: Build ECR Images, Run DB Migrations & Deploy ECS Services
    needs: validate
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials (OIDC or Secret Keys)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ vars.AWS_REGION || 'ap-south-1' }}
          role-to-assume: ${{ secrets.AWS_DEPLOYMENT_ROLE_ARN }}
          role-session-name: GitHubActionsECSDeploy

      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and Push Backend Image
        working-directory: backend
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: smartedu-backend
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG -t $ECR_REGISTRY/$ECR_REPOSITORY:latest .
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest

      - name: Build and Push Frontend Image
        working-directory: frontend
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: smartedu-frontend
          IMAGE_TAG: ${{ github.sha }}
          NEXT_PUBLIC_API_URL: ${{ vars.NEXT_PUBLIC_API_URL || '/api/v1' }}
        run: |
          docker build --build-arg NEXT_PUBLIC_API_URL=$NEXT_PUBLIC_API_URL -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG -t $ECR_REGISTRY/$ECR_REPOSITORY:latest .
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest

      - name: Run Standalone Database Migration ECS Task
        run: |
          echo "Executing release migration task before updating services..."
          TASK_ARN=$(aws ecs run-task \
            --cluster smartedu \
            --task-definition smartedu-migration \
            --launch-type FARGATE \
            --network-configuration "awsvpcConfiguration={subnets=[${{ secrets.AWS_PRIVATE_SUBNET_ID }}],securityGroups=[${{ secrets.AWS_API_SG_ID }}],assignPublicIp=DISABLED}" \
            --query "tasks[0].taskArn" \
            --output text)
          
          echo "Waiting for migration task $TASK_ARN to complete..."
          aws ecs wait tasks-stopped --cluster smartedu --tasks "$TASK_ARN"
          
          EXIT_CODE=$(aws ecs describe-tasks --cluster smartedu --tasks "$TASK_ARN" \
            --query "tasks[0].containers[0].exitCode" --output text)
          
          if [ "$EXIT_CODE" -ne "0" ]; then
            echo "Migration task failed with exit code $EXIT_CODE"
            exit 1
          fi
          echo "Database migration completed successfully."

      - name: Deploy Backend ECS Service
        run: |
          aws ecs update-service \
            --cluster smartedu \
            --service smartedu-backend \
            --force-new-deployment

      - name: Deploy Frontend ECS Service
        run: |
          aws ecs update-service \
            --cluster smartedu \
            --service smartedu-frontend \
            --force-new-deployment

      - name: Await Service Stability
        run: |
          aws ecs wait services-stable --cluster smartedu --services smartedu-backend smartedu-frontend
          echo "Deployment completed with zero downtime."
